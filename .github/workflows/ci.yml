name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verificar:
    name: Lint y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS: mismo major que desarrollo y que la imagen Docker.
          # npm 10 (Node 22) rechaza lockfiles generados por npm 11.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  imagen-arm64:
    name: Imagen Docker linux/arm64
    needs: verificar
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de imagen en minúsculas (GHCR lo exige)
        id: imagen
        run: echo "nombre=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push a GHCR (solo en main)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.imagen.outputs.nombre }}:latest
            ${{ steps.imagen.outputs.nombre }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El NAS no tiene internet: no puede hacer `docker pull`. Este .tar se
      # descarga desde Actions, se copia al NAS por SMB y se carga con
      # `docker load -i sgc-suaza-arm64.tar` en Container Station.
      - name: Exportar imagen como .tar para despliegue offline
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: sgc-suaza:latest
          outputs: type=docker,dest=/tmp/sgc-suaza-arm64.tar
          cache-from: type=gha

      - name: Comprimir imagen
        run: gzip -1 /tmp/sgc-suaza-arm64.tar

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sgc-suaza-arm64-docker
          path: /tmp/sgc-suaza-arm64.tar.gz
          retention-days: 30
