name: CI

on:
  push:
    branches: [main]
  pull_request:
  # La imagen ARM64 se construye solo a mano (Actions → CI → Run workflow):
  # el destino de despliegue de esta variante no está definido aún, la cuota
  # de almacenamiento de Actions de la cuenta es compartida con sgc-suaza y
  # cada build ARM64 por QEMU es lento. Lint y build sí corren en cada push.
  workflow_dispatch:

jobs:
  verificar:
    name: Lint y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Node 24 LTS: mismo major que desarrollo y que la imagen Docker.
          # npm 10 (Node 22) rechaza lockfiles generados por npm 11.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  imagen-arm64:
    name: Imagen Docker linux/arm64
    needs: verificar
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Nombre de imagen en minúsculas (GHCR lo exige)
        id: imagen
        run: echo "nombre=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # Tag versionado (F10-D7): va tanto en GHCR (despliegue con internet,
      # INSTALACION_INTERNET.md) como en el .tar offline — en ambos casos el
      # rollback es cambiar SGC_VERSION en el .env a este tag.
      - name: Tag versionado para rollback
        id: version
        run: echo "tag=$(date +%Y%m%d)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Login a GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build y push a GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.imagen.outputs.nombre }}:latest
            ${{ steps.imagen.outputs.nombre }}:${{ github.sha }}
            ${{ steps.imagen.outputs.nombre }}:${{ steps.version.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Despliegue offline (INSTALACION.md): el .tar se descarga desde
      # Actions, se copia al NAS por SMB y se carga con `docker load`.
      # Lleva doble tag: `latest` + el versionado del paso anterior.
      - name: Exportar imagen como .tar para despliegue offline
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          tags: |
            sgc-integral:latest
            sgc-integral:${{ steps.version.outputs.tag }}
          outputs: type=docker,dest=/tmp/sgc-integral-arm64.tar
          cache-from: type=gha

      - name: Comprimir imagen
        run: gzip -1 /tmp/sgc-integral-arm64.tar

      - name: Publicar artefacto
        uses: actions/upload-artifact@v4
        with:
          name: sgc-integral-arm64-docker-${{ steps.version.outputs.tag }}
          path: /tmp/sgc-integral-arm64.tar.gz
          # 7 días: el tar se descarga cuando se va a desplegar y se conserva
          # en el NAS; retenerlo 30 días acumuló >1 GB y agotó la cuota de
          # almacenamiento de Actions de la cuenta (visto el 2026-08-25).
          retention-days: 7
