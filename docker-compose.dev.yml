# Desarrollo local. Espeja la topología del NAS (app + Postgres, red interna),
# con dos diferencias deliberadas:
#  - Postgres expone 5432 SOLO en localhost, para poder usar `npm run dev`.
#    (En el NAS ese puerto NO se expone — regla inviolable.)
#  - La imagen de la app se construye para la plataforma local (x86); la de
#    producción la construye el CI para linux/arm64.
services:
  app:
    build: .
    ports:
      # 9081 en el host: 9080 lo usa sgc-suaza (F:\sgc) en esta misma máquina
      - "9081:3080"
    environment:
      DATABASE_URL: postgres://sgc:sgc_dev@bd:5432/sgc
    depends_on:
      bd:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 768M

  bd:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sgc
      POSTGRES_PASSWORD: sgc_dev
      POSTGRES_DB: sgc
    ports:
      # 5435 en el host: 5432 lo ocupa un Postgres nativo de Windows, 5433
      # el proyecto doctime y 5434 sgc-suaza (F:\sgc) en esta máquina
      - "127.0.0.1:5435:5432"
    volumes:
      - bd_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sgc -d sgc"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  bd_datos:
